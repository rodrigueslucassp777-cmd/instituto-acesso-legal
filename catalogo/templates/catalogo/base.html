<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Instituto de Acesso Legal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
            <a href="{% url 'catalogo:home' %}" class="flex items-center gap-2 min-h-[44px] text-gray-900 font-bold text-lg">
                <i class="fa-solid fa-scale-balanced text-blue-700" aria-hidden="true"></i>
                <span>Instituto de Acesso Legal</span>
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 mt-8">
        <div class="max-w-3xl mx-auto px-4 py-4 text-center text-sm text-gray-800">
            Instituto de Acesso Legal &mdash; informação jurídica gratuita e em linguagem simples.
        </div>
    </footer>

</body>
</html>
